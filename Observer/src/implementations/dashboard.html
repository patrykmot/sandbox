<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Observer — Live Dashboard</title>
  <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
  <script src="/static/vendor/jquery.min.js"></script>
  <script src="/static/vendor/bootstrap.bundle.min.js"></script>
  <style>
    body { background: #12151a; color: #e9ecef; }
    .card { background: #1b2027; border: 1px solid #2c333d; }
    .card-header { background: #212832; border-bottom: 1px solid #2c333d; font-weight: 600; }
    #live-view { width: 100%; border-radius: .375rem; background: #0d0f13; display: block; }
    .cfv-thumb { height: 56px; border-radius: .25rem; cursor: pointer; border: 1px solid #2c333d; }
    .cfv-thumb:hover { border-color: #6ea8fe; }
    .stat-value { font-size: 1.5rem; font-weight: 600; line-height: 1.2; }
    .stat-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: #8b949e; }
    .table > :not(caption) > * > * { background: transparent; color: #e9ecef; border-color: #2c333d; }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
<div class="container-fluid py-4">

  <div class="d-flex align-items-center justify-content-between mb-4">
    <h1 class="h4 mb-0">Observer <span class="text-secondary fw-normal">— Edge Anomaly Detection</span></h1>
    <span id="state-badge" class="badge bg-secondary fs-6">INITIALIZING</span>
  </div>

  <div class="row g-4">
    <!-- Live view -->
    <div class="col-lg-7">
      <div class="card h-100">
        <div class="card-header">Live View</div>
        <div class="card-body">
          <img id="live-view" src="/video_feed" alt="Live camera feed">
        </div>
      </div>
    </div>

    <!-- Status + progress -->
    <div class="col-lg-5">
      <div class="card mb-4">
        <div class="card-header">System Status</div>
        <div class="card-body">
          <div class="row text-center g-3 mb-4">
            <div class="col-4">
              <div class="stat-value mono" id="stat-frames">0</div>
              <div class="stat-label">Frames</div>
            </div>
            <div class="col-4">
              <div class="stat-value mono" id="stat-alarms">0</div>
              <div class="stat-label">Alarms</div>
            </div>
            <div class="col-4">
              <div class="stat-value mono" id="stat-progress">0%</div>
              <div class="stat-label">Collected</div>
            </div>
          </div>

          <div class="stat-label mb-2">Data Collection Progress</div>
          <div class="progress" style="height: 22px;">
            <div id="progress-bar"
                 class="progress-bar progress-bar-striped progress-bar-animated bg-info"
                 role="progressbar" style="width: 0%;">0%</div>
          </div>
          <div class="small text-secondary mt-2 mono" id="progress-detail">0 / 0 frames</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Alarm panel -->
  <div class="card mt-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Alarm Panel</span>
      <span class="badge bg-secondary" id="alarm-count">0 recent</span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th style="width: 90px;">Frame</th>
              <th style="width: 200px;">Timestamp (UTC)</th>
              <th style="width: 110px;">Score</th>
              <th style="width: 90px;">Objects</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody id="alarm-rows">
            <tr><td colspan="5" class="text-center text-secondary py-4">No alarms yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Enlarged CFV -->
<div class="modal fade" id="frame-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content bg-dark">
      <div class="modal-header border-secondary">
        <h5 class="modal-title text-light" id="frame-modal-title">Camera Frame View</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <img id="frame-modal-img" class="img-fluid rounded" alt="Alarm frame">
      </div>
    </div>
  </div>
</div>

<script>
  const STATE_CLASS = {
    INITIALIZING:    'bg-secondary',
    COLLECTING_DATA: 'bg-info',
    TRAINING:        'bg-warning text-dark',
    MONITORING:      'bg-success',
    ALARM_ACTIVE:    'bg-danger',
    ERROR:           'bg-dark border border-danger'
  };

  function refreshStatus() {
    $.getJSON('/api/status', function (data) {
      const pct = data.collection_progress_percent;

      $('#state-badge')
        .removeClass()
        .addClass('badge fs-6 ' + (STATE_CLASS[data.state] || 'bg-secondary'))
        .text(data.state);

      $('#stat-frames').text(data.processed_frame_count.toLocaleString());
      $('#stat-alarms').text(data.total_alarms.toLocaleString());
      $('#stat-progress').text(pct + '%');

      $('#progress-bar').css('width', pct + '%').text(pct + '%');
      $('#progress-detail').text(
        data.collected_count.toLocaleString() + ' / ' +
        data.collection_target.toLocaleString() + ' frames'
      );

      // Once collection is done the bar is static, not "in progress".
      if (data.state === 'COLLECTING_DATA') {
        $('#progress-bar').addClass('progress-bar-animated bg-info').removeClass('bg-success');
      } else {
        $('#progress-bar').removeClass('progress-bar-animated bg-info').addClass('bg-success');
      }
    });
  }

  function refreshAlerts() {
    $.getJSON('/alerts', function (data) {
      const rows = data.alarms;
      $('#alarm-count').text(rows.length + ' recent');

      if (!rows.length) {
        $('#alarm-rows').html(
          '<tr><td colspan="5" class="text-center text-secondary py-4">No alarms yet.</td></tr>'
        );
        return;
      }

      const html = rows.map(function (a) {
        const thumb = a.frame_url
          ? '<img src="' + a.frame_url + '" class="cfv-thumb" data-full="' + a.frame_url +
            '" data-time="' + a.time + '" alt="Frame ' + a.id + '">'
          : '<span class="text-secondary small">n/a</span>';
        return '<tr>' +
          '<td>' + thumb + '</td>' +
          '<td class="mono small">' + a.time + '</td>' +
          '<td class="mono"><span class="badge bg-danger">' + a.anomaly_score.toFixed(4) + '</span></td>' +
          '<td class="mono">' + a.object_count + '</td>' +
          '<td class="small text-secondary">' + a.description + '</td>' +
          '</tr>';
      }).join('');

      $('#alarm-rows').html(html);
    });
  }

  // Enlarge a Camera Frame View on click.
  $(document).on('click', '.cfv-thumb', function () {
    $('#frame-modal-img').attr('src', $(this).data('full'));
    $('#frame-modal-title').text('Camera Frame View — ' + $(this).data('time'));
    new bootstrap.Modal(document.getElementById('frame-modal')).show();
  });

  refreshStatus();
  refreshAlerts();
  setInterval(refreshStatus, 1000);
  setInterval(refreshAlerts, 2000);
</script>
</body>
</html>
