<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Winner Chess</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand fw-semibold">&#9822; Winner Chess</span>
        <div class="d-flex gap-2">
            <button id="btn-new" class="btn btn-sm btn-success">New game</button>
            <button id="btn-flip" class="btn btn-sm btn-outline-light">Flip board</button>
        </div>
    </div>
</nav>

<main class="container">
    <div class="row g-4">
        <!-- Board -->
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div id="board" class="board"></div>
                </div>
            </div>
        </div>

        <!-- Game panel -->
        <div class="col-lg-5">
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <div class="text-body-secondary small">Game ID</div>
                            <code id="game-id" class="game-id">&mdash;</code>
                        </div>
                        <button id="btn-copy" class="btn btn-sm btn-outline-secondary" disabled>Copy link</button>
                    </div>

                    <div class="players mb-3">
                        <div id="player-white" class="player">
                            <span class="piece-dot white"></span>
                            <span class="name">Player 1</span> <span class="text-body-secondary">(White)</span>
                        </div>
                        <div class="vs text-body-secondary small">vs</div>
                        <div id="player-black" class="player">
                            <span class="piece-dot black"></span>
                            <span class="name">Player 2</span> <span class="text-body-secondary">(Black)</span>
                        </div>
                    </div>

                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <span id="status-badge" class="badge text-bg-secondary">Loading&hellip;</span>
                        <span id="status-detail" class="small text-body-secondary"></span>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-body fw-semibold">Moves</div>
                <div class="card-body p-0">
                    <ol id="move-list" class="move-list mb-0"></ol>
                    <div id="move-list-empty" class="text-body-secondary small p-3">No moves yet.</div>
                </div>
            </div>

            <p class="small text-body-secondary mt-3 mb-0">
                Open the game link in a second tab or browser to play the other side; the board updates automatically.
            </p>
        </div>
    </div>
</main>

<!-- Error toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="error-toast" class="toast text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div id="error-toast-body" class="toast-body"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="app.js"></script>
</body>
</html>
